[package]
name = "reth-research"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Reth dependencies
reth-evm.workspace = true

# Revm dependencies
revm.workspace = true

# Alloy dependencies
alloy-primitives.workspace = true

# Database — SQLite with vendored build (`bundled` feature) so no
# system dep is needed. We switched back from DuckDB after running
# into its single-process writer-lock constraint: reth holds the
# writer for replay, but a consumer process can't read the same file
# while a writer is active. SQLite WAL handles 1 writer + N readers
# across processes natively. The consumer attaches via DuckDB's
# `sqlite_scanner` extension to get vectorized analytical query
# performance over the SQLite storage. See `docs/storage-redesign.md`.
rusqlite = { version = "0.32", features = ["bundled"] }

# CSV parsing
csv = "1.3"

# Serialization. serde_json is used to encode array / struct columns
# (block_summaries histograms, opcode-totals lists) as TEXT in SQLite —
# DuckDB's sqlite_scanner can json_each() them on the read side.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# Logging
tracing.workspace = true

# Error handling
thiserror.workspace = true

# Async HTTP for the external contract-label / function-signature
# backfill paths (Blockscout / Sourcify / Etherscan v2 / OpenChain).
# `default-features = false` mirrors the workspace declaration (rustls
# + stream features only — no native-tls baggage).
reqwest = { workspace = true, features = ["json", "query"] }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "net", "io-util"] }

# Config-file parsing for the optional label-backfill credentials
# (Etherscan API key, URL overrides).
toml = { workspace = true }

# Compression for the durable export-outbox payloads. The block-output
# envelope is JSON-encoded then ZSTD-compressed before it's written to
# SQLite, so a ClickHouse outage grows the outbox far more slowly than
# raw JSON would. See `export/model.rs`.
zstd = { workspace = true }

[dev-dependencies]
tempfile = "3.0"

[features]
default = []
test-utils = [
    "reth-evm/test-utils",
]
