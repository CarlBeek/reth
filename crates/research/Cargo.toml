[package]
name = "reth-research"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Reth dependencies
reth-evm.workspace = true

# Revm dependencies
revm.workspace = true
revm-interpreter.workspace = true

# Alloy dependencies
alloy-primitives.workspace = true

# Database — DuckDB with vendored build (`bundled` feature) so no
# system dep is needed. The legacy SQLite (rusqlite) and Parquet
# (arrow / parquet) deps were dropped when the storage redesign
# landed; see `docs/storage-redesign.md`.
duckdb = { version = "1.4", features = ["bundled"] }

# CSV parsing
csv = "1.3"

# Serialization
serde = { workspace = true, features = ["derive"] }

# Logging and metrics
tracing.workspace = true
metrics.workspace = true

# Error handling
thiserror.workspace = true

[dev-dependencies]
tempfile = "3.0"

[features]
default = []
test-utils = []
