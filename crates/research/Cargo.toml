[package]
name = "reth-research"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Reth dependencies
reth-evm.workspace = true
reth-primitives-traits.workspace = true
reth-execution-types.workspace = true

# Revm dependencies
revm.workspace = true
revm-interpreter.workspace = true

# Alloy dependencies
alloy-primitives.workspace = true
alloy-consensus.workspace = true

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
# DuckDB — gated behind `research-duckdb` feature. `bundled` ships a
# vendored DuckDB so there's no system dep. Used by the new storage path
# being built per `docs/storage-redesign.md`; the SQLite path stays the
# default until the consumer is fully migrated.
duckdb = { version = "1.4", features = ["bundled"], optional = true }

# Columnar export
arrow-array = "54.2"
arrow-schema = "54.2"
parquet = { version = "54.2", default-features = false, features = ["arrow", "zstd"] }

# CSV parsing
csv = "1.3"

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# Logging and metrics
tracing.workspace = true
metrics.workspace = true

# Error handling
thiserror.workspace = true

# System info
num_cpus = "1.16"

[dev-dependencies]
tempfile = "3.0"
reth-db = { workspace = true, features = ["test-utils"] }
revm-database.workspace = true

[features]
default = []
test-utils = []
# Enables the new DuckDB-backed storage layer (see
# `docs/storage-redesign.md`). When off, only the legacy SQLite path
# compiles.
research-duckdb = ["dep:duckdb"]
